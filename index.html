<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pencarian Ayat Al-Qur'an</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#2d0b0b,#1d3b1d,#4b430d);
      color:white;
      min-height:100vh;
      padding:30px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background: rgba(0,0,0,0.45);
      padding:25px;
      border-radius:20px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      color:#ffd54f;
    }

    .creator{
      text-align:center;
      margin-bottom:25px;
      color:#9be79b;
      font-size:14px;
    }

    .creator a{
      color:#ff8a80;
      text-decoration:none;
      font-weight:bold;
    }

    .search-box{
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
      margin-bottom:20px;
    }

    input{
      padding:12px;
      border:none;
      border-radius:10px;
      background:#222;
      color:white;
      font-size:15px;
    }

    button{
      padding:12px;
      border:none;
      border-radius:10px;
      background:#c62828;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#2e7d32;
      transform:scale(1.03);
    }

    .result{
      margin-top:20px;
      background:rgba(255,255,255,0.06);
      padding:20px;
      border-radius:15px;
      display:none;
    }

    .arab{
      font-size:30px;
      text-align:right;
      line-height:2;
      color:#fff59d;
      margin-bottom:15px;
    }

    .indo{
      font-size:17px;
      line-height:1.8;
      color:#f5f5f5;
    }

    .info{
      margin-top:15px;
      color:#a5d6a7;
      font-size:14px;
    }

    footer{
      text-align:center;
      margin-top:30px;
      color:#ddd;
      font-size:14px;
    }

    footer a{
      color:#ffcc80;
      text-decoration:none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📖 Pencarian Ayat Al-Qur'an</h1>

    <div class="creator">
      Dibuat oleh <b>Azkaa</b> |
      IG :
      <a href="https://www.instagram.com/kibaa.4k?igsh=MWM3czdkbTZsOGt2eQ==" target="_blank">
        @kibaa.4k
      </a>
    </div>

    <div class="search-box">

      <input type="number" id="juz" placeholder="Masukkan Juz">

      <input type="number" id="surah" placeholder="Nomor Surat">

      <input type="number" id="ayat" placeholder="Nomor Ayat">

      <button onclick="cariAyat()">Cari Ayat</button>

    </div>

    <div class="result" id="hasil">

      <div class="arab" id="arab"></div>

      <div class="indo" id="indo"></div>

      <div class="info" id="info"></div>

    </div>

  </div>

  <footer>
    Website Islami sederhana ✨ |
    Follow Instagram :
    <a href="https://www.instagram.com/kibaa.4k?igsh=MWM3czdkbTZsOGt2eQ==" target="_blank">
      @kibaa.4k
    </a>
  </footer>

  <script>
    async function cariAyat(){

      const surah = document.getElementById("surah").value;
      const ayat = document.getElementById("ayat").value;
      const juz = document.getElementById("juz").value;

      if(!surah || !ayat){
        alert("Masukkan nomor surat dan ayat!");
        return;
      }

      try{

        const response = await fetch(
          `https://api.alquran.cloud/v1/ayah/${surah}:${ayat}/editions/quran-uthmani,id.indonesian`
        );

        const data = await response.json();

        const arab = data.data[0];
        const indo = data.data[1];

        document.getElementById("hasil").style.display = "block";

        document.getElementById("arab").innerHTML = arab.text;

        document.getElementById("indo").innerHTML =
          "<b>Artinya:</b><br>" + indo.text;

        document.getElementById("info").innerHTML =
          `📚 Juz ${juz || arab.juz} | Surat ${arab.surah.englishName} (${arab.surah.number}) | Ayat ${arab.numberInSurah}`;

      }catch(error){

        alert("Ayat tidak ditemukan!");

      }
    }
  </script>

</body>
</html>
